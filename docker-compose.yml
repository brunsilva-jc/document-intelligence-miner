services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dim_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dim_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dim_db}
    ports:
      # Porta publicada no host (separada da interna, que e sempre 5432).
      # Presa ao loopback: sem o `127.0.0.1:` o Docker abre a porta em todas
      # as interfaces, e o banco de dev fica visivel para a rede local.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executado apenas na primeira inicializacao (volume vazio).
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dim} -d ${POSTGRES_DB:-dim_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dim_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro da rede do compose o host do banco e o nome do servico.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Hot reload em desenvolvimento; remova em producao.
      - ./app:/home/app/app:ro
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

volumes:
  pgdata:

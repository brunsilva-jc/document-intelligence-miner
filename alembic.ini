[alembic]
script_location = migrations
prepend_sys_path = .
# Revisoes ordenadas e legiveis: 0001_..., 0002_..., em vez de hash puro.
file_template = %%(rev)s_%%(slug)s
# Datas de criacao em UTC — o servidor e o dev raramente estao no mesmo fuso.
timezone = UTC

# A URL do banco NAO fica aqui: `migrations/env.py` a le de Settings, a mesma
# fonte que a aplicacao usa. Um lugar so para configurar, e nenhuma senha
# versionada neste arquivo.

[post_write_hooks]
hooks = black,isort
black.type = console_scripts
black.entrypoint = black
black.options = -l 100 REVISION_SCRIPT_FILENAME
isort.type = console_scripts
isort.entrypoint = isort
isort.options = --profile black -l 100 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
